<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creation Studio - Master Prompt Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 850px;
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    /* TEXTAREA CARD */
    .textarea-card {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .textarea-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .textarea-header span {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    textarea#promptArea {
      width: 100%;
      height: 240px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    /* CHARACTER CONTROLLER BAR */
    .char-controller {
      background: #151d30;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .char-tabs {
      display: flex;
      gap: 8px;
    }

    .char-btn {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .char-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }

    /* STORY BOX */
    .story-card {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      margin-bottom: 20px;
    }

    .story-card label {
      display: block;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea#storyInput {
      width: 100%;
      height: 60px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      resize: none;
    }

    /* BUTTONS */
    button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
      transition: 0.2s;
    }

    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-clean { background: #16a34a; color: white; }
    .btn-clean:hover { background: #15803d; }
    .btn-reset { background: #dc2626; color: white; }
    .btn-reset:hover { background: #b91c1c; }
    .btn-add { background: #8b5cf6; color: white; }
    .btn-add:hover { background: #7c3aed; }

    /* ACCORDION CATEGORIES */
    .accordion-item {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      text-align: left;
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-header:hover {
      background: #283548;
    }

    .accordion-body {
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* OPTION BUTTONS */
    .option-btn {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .option-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .option-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }
  </style>
</head>

// STATE CONTROL
let totalCharacters = 1;
let activeCharacter = 1;
let selections = {
  characterData: { 1: {} },
  globalData: {}
};
let selectedEffects = [];
let storyText = "";

// INITIALIZE
window.onload = function() {
  renderApp();
  updateTextarea();
};

// RENDER ACCORDIONS
function renderApp() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = '';

  categoriesData.forEach((cat, index) => {
    const acc = document.createElement('div');
    acc.className = 'accordion-item';

    acc.innerHTML = `
      <button class="accordion-header" onclick="toggleAccordion('body-${index}')">
        <span>${cat.categoryName} <small style="color:#94a3b8">(${cat.headerGroup === 'CHARACTER' ? `Target: Char ${activeCharacter}` : cat.headerGroup})</small></span>
        <span>▼</span>
      </button>
      <div id="body-${index}" class="accordion-body" style="display:none;">
        ${cat.options.map(opt => `
          <button class="option-btn" id="btn-${cat.id}-${opt.code.replace(/[^a-zA-Z0-9]/g, '')}" onclick="selectOption('${cat.headerGroup}', '${cat.key}', '${opt.code}', this, ${cat.id})">
            ${opt.label} (${opt.code})
          </button>
        `).join('')}
      </div>
    `;
    container.appendChild(acc);
  });
}

// SELECT OPTION LOGIC
function selectOption(headerGroup, key, code, btnEl, catId) {
  // SPECIAL MULTI-SELECT FOR EFFECTS (23)
  if (catId === 23) {
    if (selectedEffects.includes(code)) {
      selectedEffects = selectedEffects.filter(e => e !== code);
      btnEl.classList.remove('active');
    } else {
      if (selectedEffects.length >= 2) selectedEffects.shift(); // Keep max 2
      selectedEffects.push(code);
      btnEl.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
      selectedEffects.forEach(eff => {
        const activeBtn = document.getElementById(`btn-23-${eff.replace(/[^a-zA-Z0-9]/g, '')}`);
        if(activeBtn) activeBtn.classList.add('active');
      });
    }
    updateTextarea();
    return;
  }

  // STANDARD TOGGLE SELECT
  if (btnEl.classList.contains('active')) {
    btnEl.classList.remove('active');
    if (headerGroup === 'CHARACTER') {
      delete selections.characterData[activeCharacter][key];
    } else {
      delete selections.globalData[key];
    }
  } else {
    btnEl.parentElement.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');

    // DYNAMIC FORMATTING: Check if code starts with '@' or 'Image'
    const formattedValue = code.startsWith('@') ? `${key} = Image ${code}` : `${key} = ${code}`;

    if (headerGroup === 'CHARACTER') {
      if (!selections.characterData[activeCharacter]) selections.characterData[activeCharacter] = {};
      // Assignment using formattedValue
      selections.characterData[activeCharacter][key] = formattedValue;
    } else {
      // Handles Pose Grouping raw values vs @image values
      selections.globalData[key] = (key === "Pose Grouping" && !code.startsWith('@')) ? code : formattedValue;
    }
  }

  updateTextarea();
}

function addCharacter() {
  totalCharacters++;
  selections.characterData[totalCharacters] = {};
  
  const container = document.getElementById('charTabsContainer');
  const newBtn = document.createElement('button');
  newBtn.className = 'char-btn';
  newBtn.innerText = `Character ${totalCharacters}`;
  newBtn.onclick = function() { setActiveCharacter(totalCharacters); };
  container.appendChild(newBtn);

  setActiveCharacter(totalCharacters);
}

function setActiveCharacter(charNum) {
  activeCharacter = charNum;
  document.querySelectorAll('.char-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', (idx + 1) === charNum);
  });
  renderApp(); // Refresh active state inside accordion buttons
}

// UPDATE MASTER TEXTAREA OUTPUT
function updateTextarea() {
  let output = [];

  // 1. CHARACTER HEADERS
  for (let c = 1; c <= totalCharacters; c++) {
    output.push(`[CHARACTER ${c}]`);
    if (selections.characterData[c]) {
      Object.values(selections.characterData[c]).forEach(item => output.push(item));
    }
    output.push("");
  }

  // 2. OTHER FIXED HEADERS
  const sections = [
    { title: "[SCENE]", keys: ["Background", "Pose Grouping"] },
    { title: "[CAMERA]", keys: ["Camera Height", "Camera Angle", "Body Framing", "Lens", "Camera Quality"] },
    { title: "[LIGHTING]", keys: ["Light Type", "Light Color", "Time Of Day"] },
    { title: "[ENVIRONMENT & REALISM]", keys: ["Subject Realism", "Skin Realism", "Environmental Realism", "Overall Realism"] }
  ];

  sections.forEach(sec => {
    output.push(sec.title);
    sec.keys.forEach(k => {
      if (selections.globalData[k]) output.push(selections.globalData[k]);
    });
    output.push("");
  });

  // 3. EFFECTS
  output.push("[EFFECTS]");
  if (selectedEffects.length > 0) {
    output.push(`Effects = ${selectedEffects.join(' ')}`);
  }
  output.push("");

  // 4. STORY / MOOD
  output.push("[STORY / MOOD]");
  if (storyText.trim() !== "") output.push(storyText.trim());

  document.getElementById('promptArea').value = output.join('\n').trim();
}

// UPDATE STORY INPUT
function updateStory() {
  storyText = document.getElementById('storyInput').value;
  updateTextarea();
}

// CLEAN EMPTY HEADERS
function cleanEmptyHeaders() {
  let rawText = document.getElementById('promptArea').value;
  let lines = rawText.split('\n');
  let cleaned = [];
  let currentHeader = "";
  let headerBuffer = [];

  lines.forEach(line => {
    if (line.startsWith('[')) {
      if (headerBuffer.length > 0) {
        cleaned.push(currentHeader);
        headerBuffer.forEach(item => cleaned.push(item));
        cleaned.push("");
      }
      currentHeader = line;
      headerBuffer = [];
    } else if (line.trim() !== "") {
      headerBuffer.push(line);
    }
  });

  if (headerBuffer.length > 0) {
    cleaned.push(currentHeader);
    headerBuffer.forEach(item => cleaned.push(item));
  }

  document.getElementById('promptArea').value = cleaned.join('\n').trim();
}

// RESET ALL
function resetDefaults() {
  totalCharacters = 1;
  activeCharacter = 1;
  selections = { characterData: { 1: {} }, globalData: {} };
  selectedEffects = [];
  storyText = "";
  
  document.getElementById('storyInput').value = '';
  document.getElementById('charTabsContainer').innerHTML = `
    <button class="char-btn active" onclick="setActiveCharacter(1)">Character 1</button>
  `;
  
  renderApp();
  updateTextarea();
}

// COPY PROMPT TO CLIPBOARD
function copyPrompt(btn) {
  const text = document.getElementById('promptArea').value;
  if (!text) return;

  navigator.clipboard.writeText(text).then(() => {
    const original = btn.innerText;
    btn.innerText = "✓ Copied!";
    setTimeout(() => btn.innerText = original, 1200);
  });
}

// ACCORDION TOGGLE
function toggleAccordion(id) {
  const body = document.getElementById(id);
  body.style.display = body.style.display === 'none' ? 'flex' : 'none';
}
