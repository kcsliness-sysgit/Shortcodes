<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creation Studio - Master Prompt Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    /* TEXTAREA CARD */
    .textarea-card {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .textarea-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .textarea-header span {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    textarea#promptArea {
      width: 100%;
      height: 220px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    /* STORY BOX */
    .story-card {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      margin-bottom: 20px;
    }

    .story-card label {
      display: block;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea#storyInput {
      width: 100%;
      height: 60px;
      background: #0b0f19;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      resize: none;
    }

    /* BUTTONS */
    button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
      transition: 0.2s;
    }

    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-clean { background: #16a34a; color: white; }
    .btn-clean:hover { background: #15803d; }
    .btn-reset { background: #dc2626; color: white; }
    .btn-reset:hover { background: #b91c1c; }

    /* ACCORDION CATEGORIES */
    .accordion-item {
      background: #151d30;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      text-align: left;
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-header:hover {
      background: #283548;
    }

    .accordion-body {
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* OPTION BUTTONS */
    .option-btn {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .option-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .option-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }
  </style>
</head>

// STATE STORAGE
let selections = {};
let storyText = "";

// INITIALIZE
window.onload = function() {
  renderApp();
  updateTextarea();
};

// RENDER ACCORDIONS
function renderApp() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = '';

  categoriesData.forEach((cat, index) => {
    const acc = document.createElement('div');
    acc.className = 'accordion-item';

    acc.innerHTML = `
      <button class="accordion-header" onclick="toggleAccordion('body-${index}')">
        <span>${cat.categoryName} <small style="color:#94a3b8">(${cat.headerGroup})</small></span>
        <span>▼</span>
      </button>
      <div id="body-${index}" class="accordion-body" style="display:none;">
        ${cat.options.map(opt => `
          <button class="option-btn" onclick="selectOption('${cat.headerGroup}', '${cat.key}', '${opt.code}', this)">
            ${opt.label} (${opt.code})
          </button>
        `).join('')}
      </div>
    `;
    container.appendChild(acc);
  });
}

// SELECT / REPLACE SHORTCODE
function selectOption(headerGroup, key, code, btnEl) {
  const parent = btnEl.parentElement;
  
  if (btnEl.classList.contains('active')) {
    btnEl.classList.remove('active');
    if (selections[headerGroup] && selections[headerGroup][key]) {
      delete selections[headerGroup][key];
    }
  } else {
    parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');

    if(!selections[headerGroup]) {
      selections[headerGroup] = {};
    }
    selections[headerGroup][key] = `${key} = ${code}`;
  }

  updateTextarea();
}

// UPDATE MASTER TEXTAREA
function updateTextarea() {
  let output = [];

  defaultHeaders.forEach(header => {
    output.push(header);

    if (selections[header]) {
      Object.values(selections[header]).forEach(item => {
        output.push(item);
      });
    }

    if (header === "[STORY / MOOD]" && storyText.trim() !== "") {
      output.push(storyText.trim());
    }

    output.push(""); // Empty line separator
  });

  document.getElementById('promptArea').value = output.join('\n').trim();
}

// UPDATE STORY/MOOD
function updateStory() {
  storyText = document.getElementById('storyInput').value;
  updateTextarea();
}

// CLEAN EMPTY HEADERS
function cleanEmptyHeaders() {
  let output = [];

  defaultHeaders.forEach(header => {
    let hasContent = false;
    let items = [];

    if (selections[header] && Object.keys(selections[header]).length > 0) {
      hasContent = true;
      items = Object.values(selections[header]);
    }

    if (header === "[STORY / MOOD]" && storyText.trim() !== "") {
      hasContent = true;
      items.push(storyText.trim());
    }

    if (hasContent) {
      output.push(header);
      items.forEach(it => output.push(it));
      output.push("");
    }
  });

  document.getElementById('promptArea').value = output.join('\n').trim();
}

// RESET ALL
function resetDefaults() {
  selections = {};
  storyText = "";
  document.getElementById('storyInput').value = '';
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
  updateTextarea();
}

// COPY PROMPT
function copyPrompt(btn) {
  const text = document.getElementById('promptArea').value;
  if(!text) return;

  navigator.clipboard.writeText(text).then(() => {
    const original = btn.innerText;
    btn.innerText = "✓ Copied!";
    setTimeout(() => btn.innerText = original, 1200);
  });
}

// ACCORDION TOGGLE
function toggleAccordion(id) {
  const body = document.getElementById(id);
  body.style.display = body.style.display === 'none' ? 'flex' : 'none';
}
