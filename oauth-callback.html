<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest OAuth Callback</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,sans-serif;padding:20px}
    main{width:min(680px,100%);background:#111;border:1px solid #292929;border-radius:16px;padding:22px;box-sizing:border-box}
    h1{font-size:20px;margin:0 0 10px}
    p{color:#aaa;line-height:1.5}
    code{display:block;white-space:pre-wrap;word-break:break-all;background:#050505;border:1px solid #292929;border-radius:10px;padding:12px;color:#ff7ab0;font-size:13px}
    .ok{color:#7dffac;font-weight:700}
    .warn{color:#ffd36b;font-weight:700}
    button{margin-top:12px;background:#ff4d91;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>Pinterest OAuth Callback</h1>
  <div id="status"></div>
  <p id="details"></p>
  <code id="codeBox" hidden></code>
  <button id="copyBtn" hidden>Copy authorization code</button>
</main>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const errorDescription = params.get('error_description');

  const status = document.getElementById('status');
  const details = document.getElementById('details');
  const codeBox = document.getElementById('codeBox');
  const copyBtn = document.getElementById('copyBtn');

  if (error) {
    status.innerHTML = '<p class="warn">Pinterest authorization returned an error.</p>';
    details.textContent = errorDescription || error;
    return;
  }

  if (!code) {
    status.innerHTML = '<p class="warn">No authorization code was received.</p>';
    details.textContent = 'Open this page only after Pinterest redirects back to it during OAuth authorization.';
    return;
  }

  status.innerHTML = '<p class="ok">Pinterest authorization code received.</p>';
  details.textContent = state ? 'State was received successfully. Copy the code below for the token-exchange step.' : 'Copy the code below for the token-exchange step.';
  codeBox.hidden = false;
  copyBtn.hidden = false;
  codeBox.textContent = code;

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(code);
      copyBtn.textContent = 'Copied';
    } catch (e) {
      copyBtn.textContent = 'Copy failed — select the code manually';
    }
  });
})();
</script>
</body>
</html>
